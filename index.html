seed[0].body=`# Vocational Education in Portugal: A Guide for International Students\n\nChoosing a vocational programme in Portugal begins with a practical question: what qualification do you need to reach your next academic or professional goal? International students should compare the awarding organisation, learning format, entry requirements and progression options before making a decision.\n\n## Understand the qualification before you apply\nA vocational qualification focuses on developing knowledge and skills in a particular field. The level, awarding organisation and assessment requirements can vary considerably. Ask whether the programme leads to a qualification or a certificate of attendance, and whether a university or employer you intend to approach accepts it for your intended purpose.\n\n## Explore British qualification pathways\nEuroPolytech Academy offers British vocational qualification pathways. Prospective students can review the academy’s programme catalogue and ask the admissions team which qualifications and delivery formats are currently available. Progression to another institution is subject to that institution’s entry requirements and recognition decisions.\n\n## Compare online and in-person study\nOnline study may suit learners who want to study from their home country. An in-person educational experience may offer opportunities to explore Portugal and meet other learners. The right option depends on your goals, eligibility, budget and availability. Check the current programme conditions directly with the academy.\n\n## Check entry and travel requirements separately\nAdmission to a course is not a visa or residence permission. If you intend to travel to Portugal, check the applicable entry, study and stay conditions with the competent authorities before making commitments.\n\n## Questions to ask before enrolling\n- What is the full qualification title and awarding organisation?\n- What are the entry requirements and assessment methods?\n- What is the total cost and delivery format?\n- What progression opportunities are available, and who decides eligibility?\n- What travel or immigration requirements apply to my circumstances?\n\nExplore the EuroPolytech Academy programme catalogue to identify a pathway that fits your goals, then contact admissions for current availability and personalised guidance.`;

function parseCSV(s){s=s.replace(/^\uFEFF/,'');let rows=[],row=[],field='',q=false;for(let i=0;i<s.length;i++){let c=s[i];if(q){if(c==='"'&&s[i+1]==='"'){field+='"';i++}else if(c==='"'){q=false}else field+=c}else if(c==='"'){q=true}else if(c===','){row.push(field);field=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&s[i+1]==='\n')i++;row.push(field);if(row.some(x=>x!==''))rows.push(row);row=[];field=''}else field+=c}if(q)throw Error('Unclosed CSV quote.');if(field!==''||row.length){row.push(field);rows.push(row)}return rows}
function csvEsc(v){return '"'+String(v??'').replaceAll('"','""')+'"'}function currentArticle(){return state.articles.find(x=>x.id===active)}function collectArticle(){let a=currentArticle(),form=$('articleForm');if(!a||!form.reportValidity())return null;let d=Object.fromEntries(new FormData(form));for(let k of ['title','brand','priority','keyword','language','url','slug','meta','body','social','sources','due'])a[k]=String(d[k]||'').trim();a.checks=checks.map((_,i)=>!!d['check'+i]);return a}function brief(a){return `Draft a substantive, original SEO article for ${a.brand}.\nTitle: ${a.title}\nTarget query: ${a.keyword}\nLanguage: ${a.language}\nCTA: ${a.url}\nUse official and current sources; cite URLs and mark unverified facts. Do not imply guaranteed scholarships, visas, residency, employment or progression. Distinguish qualifications from degrees and verify awarding body and programme details. Use clear headings, a concise meta description, natural internal links, and a separate channel-specific social caption.\nExisting notes: ${a.sources}`}
function markdownHTML(a){let lines=a.body.split(/\r?\n/),out=[],bullets=[];const flush=()=>{if(bullets.length){out.push('<ul>'+bullets.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>');bullets=[]}};for(let line of lines){if(/^#\s/.test(line))continue;if(/^-\s/.test(line)){bullets.push(line.replace(/^-\s/,''));continue}flush();if(/^#{2,3}\s/.test(line)){let h=line.startsWith('###')?'h3':'h2';out.push('<'+h+'>'+esc(line.replace(/^#{2,3}\s/,''))+'</'+h+'>')}else if(line.trim())out.push('<p>'+esc(line)+'</p>')}flush();return out.join('\n')}
function exportHTML(a){let link=safeURL(a.url),lang=a.language.toLowerCase().includes('portugu')?'pt-BR':a.language.toLowerCase().includes('espa')?'es':'en';let h=`<!doctype html>\n<html lang="${lang}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(a.title)} | ${esc(a.brand)}</title><meta name="description" content="${esc(a.meta)}"><meta property="og:type" content="article"><meta property="og:title" content="${esc(a.title)}"><meta property="og:description" content="${esc(a.meta)}"><style>[hidden]{display:none!important}</style></head><body><main><article><h1>${esc(a.title)}</h1>\n${markdownHTML(a)}\n${link?`<p><a href="${esc(link)}">${lang==='pt-BR'?'Saiba mais':lang==='es'?'Más información':'Explore current opportunities'}</a></p>`:''}</article></main></body></html>`;dl((a.slug||'article').replace(/[^a-zA-Z0-9-]/g,'-')+'.html',h,'text/html');toast('HTML exported. Add canonical URL and site navigation when publishing.')}

if($('outForm')){$('outForm').onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(e.target));if(!safeURL(x.url))return toast('Enter a valid website URL.');state.outreach.unshift({...x,id:uid(),status:'Identified'});save();render();toast('Prospect saved')};$('copyResearch').onclick=()=>copy('Find 10 verifiable, relevant educational directories, study-abroad publications, cultural organisations or institutional partners for EuroPolytech Academy, MeritGate and SkillCamp in Porto. For each, provide current public URL, audience, relevance, editorial or partnership requirements, public contact route and a personalised value proposition. Exclude link farms, paid link schemes and fabricated contacts. Verify all results from official sources.')}

if($('saveProperty')){$('saveProperty').onclick=()=>{state.property=$('property').value.trim()||'Unspecified property';state.source=$('source').value.trim()||'Manual import';save();toast('Source labels saved')};$('backup').onclick=()=>dl('growth-studio-backup-'+today()+'.json',JSON.stringify(state,null,2),'application/json');$('restoreBaseline').onclick=()=>{if(confirm('Replace all analytics tables with the original export? Your content and other records will be retained.')){state.data=structuredClone(baseline);state.property='europolytech.academy';state.source='Search Console export · 25 Nov 2026';save();render();toast('Baseline restored')}};$('importCsv').onclick=async()=>{try{let f=$('csvfile').files[0],d=$('importDim').value;if(!f)throw Error('Choose a CSV file first.');let r=parseCSV(await f.text()),h=r[0];if(!h||h.length!==5||h.slice(1).map(x=>x.trim().toLowerCase()).join(',')!=='clicks,impressions,ctr,position')throw Error('Expected five Search Console columns: name/date, Clicks, Impressions, CTR, Position.');let expected=baseline[d][0][0].toLowerCase();if(h[0].trim().toLowerCase()!==expected)throw Error('The first column does not match the selected report: '+baseline[d][0][0]);let out=r.slice(1).map((x,i)=>{if(x.length!==5||!x[0])throw Error('Invalid CSV row '+(i+2));let cv=x.slice(1).map((v,j)=>{let t=v.trim().replace(/,/g,''),z=Number(t.replace('%',''));if(!t||!Number.isFinite(z)||z<0)throw Error('Invalid number at row '+(i+2));return j===2&&t.endsWith('%')?z/100:z});if(cv[2]>1)throw Error('CTR must be a fraction or a percentage with % sign.');if(d==='Chart'&&!/^\d{4}-\d{2}-\d{2}$/.test(x[0]))throw Error('Daily dates must use YYYY-MM-DD.');return [x[0],...cv]});if(!confirm('Replace '+d+' with '+out.length+' rows? Ensure all reports cover the same property and period.'))return;if(d==='Chart')out.sort((a,b)=>a[0].localeCompare(b[0]));state.data[d]=[h,...out];state.property=$('property').value.trim()||state.property;state.source=$('source').value.trim()||f.na async function login(e){e.preventDefault();$('loginButton').disabled=true;$('authMessage').textContent='Signing in…';try{let r=await client.auth.signInWithPassword({email:$('loginEmail').value,password:$('loginPassword').value});$('loginPassword').value='';if(r.error)throw r.error;let q=await client.from('growth_workspace').select('payload,original_data,revision').eq('id',1).single();if(q.error||!q.data?.payload||!q.data?.original_data){await client.auth.signOut();throw Error('Workspace access is unavailable. Ask the administrator to verify your membership and database setup.')}state=q.data.payload;baseline=q.data.original_data;version=q.data.revision;pending=null;conflict=false;signedIn=true;page='Overview';active=state.articles[0]?.id;render();$('authGate').hidden=true;$('workspace').hidden=false;statusSync('Saved to cloud');$('authMessage').textContent=''}catch(e){$('authMessage').textContent=e.message||'Unable to sign in.'}finally{$('loginButton').disabled=false}}
function initCloud(){let c=window.GROWTH_CONFIG;if(!window.supabase||!c||!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(c.url||'')||!c.publishableKey||c.publishableKey.includes('REPLACE')){$('loginButton').disabled=true;$('authMessage').textContent='Deployment setup is incomplete. The administrator must configure the Supabase project URL and publishable key.';return}client=window.supabase.createClient(c.url,c.publishableKey,{auth:{persistSession:false,autoRefreshToken:true,detectSessionInUrl:false}});$('loginForm').onsubmit=login;$('retrySync').onclick=()=>{if(conflict)return toast('Export your backup, then reload and resolve the conflict.');void flushCloud()};$('logout').onclick=async()=>{if((pending||saving)&&!confirm('Some changes may not be saved. Export a backup before signing out. Continue?'))return;let r=await client.auth.signOut();if(r.error){toast('Sign out failed; retry or close the tab.');return}signedIn=false;location.reload()};window.addEventListener('beforeunload',e=>{if(pending||saving){e.preventDefault();e.returnValue=''}})}

let jobRows=[],jobLoading=false,jobError='';

function jobPanel(){
 let a=state.articles.find(x=>x.id===active)||state.articles[0];if(a)active=a.id;
 const hasOpen=(kind)=>jobRows.some(x=>x.article_id===a?.id&&x.kind===kind&&['queued','running'].includes(x.status));

 '<div class="grid two"><div class="panel"><h2>Content engine</h2><label>Choose saved article</label><select id="jobArticle">'+state.articles.map(x=>'<option value="'+esc(x.id)+'" '+(x.id===a?.id?'selected':'')+'>'+esc(x.title)+'</option>').join('')+'</select>'+
 (a?'<p>'+status(a.status)+' · '+esc(a.brand)+' · '+esc(a.language)+'</p><div class="toolbar"><button class="btn primary" id="requestDraft" '+(hasOpen('draft')?'disabled':'')+'>Request AI draft</button><button class="btn" id="editJobArticle">Open editor</button></div><p class="note">Requests are processed by the scheduled ChatGPT research worker. Drafts are never approved automatically. Use Refresh job status to check the result.</p>':'<p>No articles available.</p>')+

async function refreshJobs(){if(!signedIn||jobLoading)return;jobLoading=true;jobError='';if(page==='AI & publishing')render();try{let q=await client.from('growth_jobs').select('id,article_id,kind,request,status,result,created_at,finished_at').order('created_at',{ascending:false}).limit(100);if(q.error)throw q.error;jobRows=q.data||[]}catch(e){jobError=e.message||'Unable to load jobs'}finally{jobLoading=false;if(page==='AI & publishing')render()}}
async function submitGrowthJob(kind){let a=currentArticle();if(!a||!signedIn)return;if(pending||saving||conflict)return toast('Finish saving the workspace before requesting a job.');if(kind==='publish'&&!jobEligible(a))return toast('A saved, fully approved article and valid slug are required.');
 if(jobRows.some(x=>x.article_id===a.id&&x.kind===kind&&['queued','running'].includes(x.status)))return toast('This article already has a pending request.');
 if(kind==='publish'&&!confirm('Publish this exact approved article publicly at https://growth.europolytech.academy/resources/'+a.slug+'/? This will be readable and indexable by anyone.'))return;
 const request={title:a.title,brand:a.brand,keyword:a.keyword,language:a.language,url:a.url,slug:a.slug,meta:a.meta,body:a.body,social:a.social,sources:a.sources,checks:a.checks,status:a.status};
 try{let q=await client.from('growth_jobs').insert({article_id:a.id,kind,request});if(q.error)throw q.error;toast('Request queued successfully');await refreshJobs()}catch(e){toast(e.message||'Request failed')}
}

}
